name: final_onestep_torch_rolling_nocost_v2
dataset:
  datacube_path: DataCube_1990_2024.mat
  panel_output_dir: artifacts/datasets/panel
features:
  construction_mode: direct_cube
  panel_input_dir: artifacts/datasets/panel/panel.parquet
  feature_output_dir: artifacts/features/features.parquet
  winsorize_lower: 0.01
  winsorize_upper: 0.99
  min_history: 26
cv:
  scheme: rolling
  train_min_periods: 120
  train_window_periods: 120
  validation_periods: 1
  step_periods: 1
onestep:
  feature_columns:
    - mom_12_1
    - mom_6_1
    - mom_3_1
    - tsmom_12
    - tsmom_sign_12
    - reversal_1m
    - ma_gap_12m
    - ma_crossover_6_12
    - ma_signal_3_12
    - vol_3m
    - vol_12m
    - vol_regime_3_12
    - log_volume
    - abnormal_log_volume
  target_column: target_ret_1m
  learning_rate: 0.01
  epochs: 120
  batch_dates: 24
  l2_penalty: 0.0
  turnover_penalty: 0.02
  risk_aversion: 0.10
  weight_clip: 0.10
  selection_quantile: 0.10
  random_seed: 42
backtest:
  top_quantile: 0.10
  transaction_cost_bps: [0.0]
  conventions: [one_way]
tracking:
  enabled: false
  tracking_uri: sqlite:///artifacts/mlflow.db
  experiment_name: fhdata-experiments
