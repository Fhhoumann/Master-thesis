[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fhdata"
version = "0.1.0"
description = "Research framework for point-in-time equity panel experiments."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.11",
    "lightgbm>=4.6",
    "matplotlib>=3.10",
    "mlflow>=2.20",
    "numpy>=2.2",
    "pandas>=2.2",
    "plotly>=5.24",
    "pyarrow>=19.0",
    "pydantic>=2.10",
    "pyyaml>=6.0",
    "scikit-learn>=1.6",
    "seaborn>=0.13",
    "torch>=2.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["apps", "core"]
